name: Trova release

on:
  workflow_dispatch:
    inputs:
      require_signing:
        description: "Fail if platform signing/updater secrets are missing"
        required: false
        default: "false"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build local-backend sidecar (zero-config su Windows/macOS)
        run: npm run bundle:backend

      - name: Goal 8 packaging smoke
        run: npm run test:goal8

      - name: Release preflight
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # NB: niente env APPLE_*/WINDOWS_* qui: se vuote, tauri tenta comunque il codesign
          # (security import di un certificato vuoto -> fallisce). Build non firmate di default.
        run: |
          EXTRA=""
          # Richiediamo la firma solo se manualmente attivato; di default i tag producono installer non firmati ma installabili.
          if [ "${{ github.event.inputs.require_signing || 'false' }}" = "true" ]; then
            EXTRA="--require-signing"
          fi
          node scripts/trova-release.mjs status $EXTRA

      - name: Build release bundle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # NB: niente env APPLE_*/WINDOWS_* qui: se vuote, tauri tenta comunque il codesign
          # (security import di un certificato vuoto -> fallisce). Build non firmate di default.
        run: |
          EXTRA=""
          # Richiediamo la firma solo se manualmente attivato; di default i tag producono installer non firmati ma installabili.
          if [ "${{ github.event.inputs.require_signing || 'false' }}" = "true" ]; then
            EXTRA="--require-signing"
          fi
          node scripts/trova-release.mjs build $EXTRA

      - name: Generate updater manifest
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/trova-release.mjs manifest

      - uses: actions/upload-artifact@v4
        with:
          name: trova-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*
            dist/release/latest.json
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: build
    # always(): pubblica gli installer che sono stati prodotti anche se un OS fallisce
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          fail_on_unmatched_files: false
          # SOLO gli installer reali (no file interni .deb / node a 0 byte / nomi duplicati,
          # che facevano fallire il publish con "size must be >= 1").
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.msi
            artifacts/**/*.exe
